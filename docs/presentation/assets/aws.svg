<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8073"/>
    </marker>
  </defs>

  <!-- external services -->
  <g font-size="14" fill="#26201A">
    <rect x="14" y="150" width="150" height="130" rx="10" fill="#EAE5D8" stroke="#C9BFA8"/>
    <text x="89" y="180" text-anchor="middle" font-size="13" fill="#8A8073">ЗОВНІШНІ API</text>
    <text x="89" y="210" text-anchor="middle">GitHub</text>
    <text x="89" y="234" text-anchor="middle">HuggingFace</text>
    <text x="89" y="258" text-anchor="middle">Anthropic</text>
  </g>

  <!-- NAT -->
  <rect x="200" y="195" width="70" height="44" rx="8" fill="#F4E2DA" stroke="#D8A48F"/>
  <text x="235" y="222" text-anchor="middle" font-size="14" fill="#8C3A1D">NAT</text>

  <g fill="none" stroke="#8A8073" stroke-width="2" marker-end="url(#ah3)">
    <path d="M164 217 L196 217"/>
    <path d="M270 217 L322 217"/>
  </g>

  <!-- VPC -->
  <rect x="300" y="40" width="680" height="372" rx="14" fill="none" stroke="#BC5430" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="320" y="68" font-size="15" fill="#8C3A1D" font-weight="600">AWS VPC</text>

  <!-- EC2 -->
  <rect x="324" y="92" width="300" height="290" rx="10" fill="#F3E8CB" stroke="#D8C074"/>
  <text x="474" y="120" text-anchor="middle" font-size="17" fill="#26201A" font-weight="600">EC2</text>
  <g font-size="14" fill="#26201A">
    <rect x="346" y="138" width="256" height="40" rx="7" fill="#FBF9F3" stroke="#E0DACA"/>
    <text x="474" y="163" text-anchor="middle">Airflow (3 DAG-и)</text>
    <rect x="346" y="188" width="256" height="40" rx="7" fill="#FBF9F3" stroke="#E0DACA"/>
    <text x="474" y="213" text-anchor="middle">Qdrant</text>
    <rect x="346" y="238" width="256" height="40" rx="7" fill="#FBF9F3" stroke="#E0DACA"/>
    <text x="474" y="263" text-anchor="middle">FastAPI + дашборд</text>
    <rect x="346" y="288" width="256" height="40" rx="7" fill="#FBF9F3" stroke="#E0DACA"/>
    <text x="474" y="313" text-anchor="middle">Prometheus + Grafana</text>
    <text x="474" y="356" text-anchor="middle" font-size="13" fill="#5A5043">DuckDB — файл на EBS</text>
  </g>

  <!-- managed services -->
  <g font-size="15" fill="#26201A">
    <rect x="664" y="100" width="288" height="64" rx="10" fill="#E7EEE2" stroke="#A9C29F"/>
    <text x="808" y="137" text-anchor="middle">RDS MySQL (bronze)</text>

    <rect x="664" y="184" width="288" height="64" rx="10" fill="#E7EEE2" stroke="#A9C29F"/>
    <text x="808" y="213" text-anchor="middle">S3</text>
    <text x="808" y="233" text-anchor="middle" font-size="13" fill="#5A5043">логи, артефакти, снапшоти</text>

    <rect x="664" y="268" width="288" height="64" rx="10" fill="#E7EEE2" stroke="#A9C29F"/>
    <text x="808" y="297" text-anchor="middle">Secrets Manager</text>
    <text x="808" y="317" text-anchor="middle" font-size="13" fill="#5A5043">токени, ключі, паролі</text>
  </g>

  <g fill="none" stroke="#8A8073" stroke-width="2" marker-end="url(#ah3)">
    <path d="M624 150 L660 140"/>
    <path d="M624 216 L660 214"/>
    <path d="M624 282 L660 296"/>
  </g>
</svg>
