ml_underground:
  target: prod
  outputs:
    prod:
      type: duckdb
      # single warehouse file shared by load_to_duckdb.py, dbt and ml/data.py;
      # catalog name = file stem (ML_UNDERGROUND), matching sources.yml.
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/dbt/ML_UNDERGROUND.duckdb') }}"
      threads: 4
