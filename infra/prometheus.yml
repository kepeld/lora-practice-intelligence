global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Custom pipeline exporter — bronze row counts, Qdrant, DAG health.
  - job_name: pipeline-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ['pipeline-exporter:9101']
