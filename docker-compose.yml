# ---------------------------------------------------------------------------
# ML Underground — Docker Compose
#
# Profiles:
#   de       - Data engineering stack: MySQL, Airflow, Qdrant
#   ml       - Vector DB: Qdrant (embeddings / RAG)
#   monitor  - Monitoring stack: Grafana, Prometheus
#   all      - Full stack
#
# Usage:
#   docker compose --profile de up -d
#   docker compose --profile de --profile monitor up -d
#   docker compose --profile all up -d
# ---------------------------------------------------------------------------

x-airflow-common: &airflow-common
  build:
    context: ./de/airflow
    dockerfile: Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://airflow:airflow@mysql:3306/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Shared across all Airflow components so the webserver can fetch task
    # logs from the scheduler/worker without a 403.
    AIRFLOW__WEBSERVER__SECRET_KEY: 'ml-underground-secret-key'
    # Pipeline config — pulled from the root .env file (do NOT use env_file:
    # here, .env points KAFKA/MYSQL/MINIO at localhost which breaks containers)
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    HF_BATCH_SIZE: ${HF_BATCH_SIZE:-100}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    DUCKDB_PATH: ${DUCKDB_PATH:-/opt/airflow/dbt/ML_UNDERGROUND.duckdb}
  volumes:
    - ./de/airflow/dags:/opt/airflow/dags
    - ./de/ingestion:/opt/airflow/ingestion
    - ./de/dbt/ml_underground:/opt/airflow/dbt
    - ./de/quality:/opt/airflow/quality
    - airflow-logs:/opt/airflow/logs
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - ml-underground

services:

  # ---------------------------------------------------------------------------
  # Profile: de — MySQL (staging / Bronze layer + Airflow metadata)
  # ---------------------------------------------------------------------------

  mysql:
    image: mysql:8.0
    container_name: mysql
    profiles: [de, all]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow
      MYSQL_DATABASE: airflow
    volumes:
      - mysql-data:/var/lib/mysql
      - ./de/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      - ml-underground

  # ---------------------------------------------------------------------------
  # Profile: de — Airflow (orchestration)
  # ---------------------------------------------------------------------------

  # Initializes the Airflow database and creates the admin user on first run
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    profiles: [de, all]
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db init &&
        airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname Admin
        --role Admin
        --email admin@example.com
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    profiles: [de, all]
    ports:
      - "8081:8080"
    command: webserver
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    profiles: [de, all]
    command: scheduler
    restart: always

  # ---------------------------------------------------------------------------
  # Profile: ml — Qdrant (vector database for embeddings / RAG)
  # ---------------------------------------------------------------------------

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    # in the de profile too: the embed_repos DAG task writes to Qdrant
    profiles: [de, ml, all]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ml-underground

  # ---------------------------------------------------------------------------
  # Profile: monitor — Prometheus + Grafana
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: [monitor, all]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ml-underground

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: [monitor, all]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - ml-underground

  # Custom exporter — pipeline metrics (MySQL row counts, Qdrant, DAG health)
  pipeline-exporter:
    build:
      context: ./infra/exporter
    container_name: pipeline-exporter
    profiles: [monitor, all]
    environment:
      MYSQL_HOST: mysql
      QDRANT_HOST: qdrant
    ports:
      - "9101:9101"
    networks:
      - ml-underground

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------

networks:
  ml-underground:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  mysql-data:
  qdrant-data:
  airflow-logs:
  prometheus-data:
  grafana-data: